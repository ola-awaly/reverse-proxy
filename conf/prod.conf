  server {
    listen 80;
    server_name mastermind.olatech.ovh;
    return 301 https://mastermind.olatech.ovh$request_uri;
}
server {
    listen 443 ssl;
    server_name mastermind.olatech.ovh ;

    ssl_certificate /etc/letsencrypt/live/olatech.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olatech.ovh/privkey.pem;

    # Configurations SSL supplémentaires
    ssl_protocols TLSv1.2 TLSv1.3;
   

     location / {
        proxy_pass http://mastermindclient; # Dirige tout vers le service React
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       
    
    }
    location /api {
    proxy_pass http://mastermindserver:8080;
    
    }
}
