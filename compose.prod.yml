services:
   reverse-proxy:
      image: ghcr.io/ola-awaly/reverse-proxy/reverse-proxy

      networks:
         - mastermind
         - cvgenerator
         - portfolio
         - monportfolio
      ports:
         - 80:80

         - 443:443
      volumes:
         - /etc/letsencrypt:/etc/letsencrypt # Pour stocker les certificats SSL

      restart: unless-stopped

networks:
   mastermind:
      driver: bridge
   cvgenerator:
      driver: bridge
   portfolio:
      driver: bridge
   monportfolio:
      driver: bridge
